name: deploy

# push в main или ручной запуск: разбор → недостающие клипы TTS (Python ставится только при промахе кэша)
# → тесты → сборка → e2e → проверка размера → GitHub Pages. Раздел 12.
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Разбор пьесы (content/*.txt → src/data/play.json)
        run: npm run parse -- --validate

      - name: Кэш TTS (клипы, веса Silero, голоса Piper)
        uses: actions/cache@v4
        with:
          path: |
            .tts-cache
            ~/.cache/torch/hub
            ~/.cache/piper-voices
          key: tts-${{ hashFiles('content/**', 'tools/tts/**') }}
          restore-keys: tts-

      - name: План озвучки (без Python)
        id: plan
        run: npx tsx tools/tts/plan.ts --cache .tts-cache >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.missing != '0'
        uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tools/tts/requirements.txt }
      - if: steps.plan.outputs.missing != '0'
        name: Синтез недостающих клипов
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r tools/tts/requirements.txt
          python -m tools.tts --cache .tts-cache

      - name: Клипы и audio-manifest.json
        run: npx tsx tools/tts/emit.ts --cache .tts-cache --out public/audio

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Сборка (base /text-learning/)
        run: npm run build

      - name: e2e
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Размер сайта ≤ 100 МБ
        run: npm run check:size

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
