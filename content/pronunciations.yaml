# Словарь произношения для синтеза (раздел 9.3). «+» ставится перед ударной гласной.
# global — замены во всём тексте: ключ ищется с начала слова, поэтому «Гайдн» покрывает и «Гайдна».
# lines  — точечные правки омографов в конкретной реплике: { from, to }.
# Найденное при прослушивании сцен добавляется сюда; изменённые фразы перегенерируются автоматически.
global:
  Гайдн: Г+айдн
  Моцарт: М+оцарт
  супертон: суперт+он
  орангутанг: орангут+анг
  вертеп: верт+еп
  муниципалитет: муниципалит+ет
  директорат: директор+ат
  инфарктик: инф+арктик
  инсультик: инс+ультик
lines: {}
#  L0123: { from: замок, to: зам+ок }
